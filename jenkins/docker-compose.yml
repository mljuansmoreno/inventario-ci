services:
  jenkins:
    build: .
    container_name: jenkins-clase
    ports:
      - '127.0.0.1:${JENKINS_PUERTO:-8080}:8080'
    environment:
      CASC_JENKINS_CONFIG: /opt/curso/jenkins.yaml
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false
      JENKINS_CLAVE: ${JENKINS_CLAVE:-cambiar-esta-clave}
    group_add:
      - '${DOCKER_GID:-0}'
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
