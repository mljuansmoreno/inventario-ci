jenkins:
  systemMessage: 'Integración Continua · Unidad 2 · Escenario 4'
  numExecutors: 1
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: estudiante
          password: '${JENKINS_CLAVE}'
  authorizationStrategy:
    globalMatrix:
      entries:
        - user:
            name: estudiante
            permissions:
              - Overall/Administer
jobs:
  - script: |
      pipelineJob('inventario') {
        definition {
          cpsScm {
            scm {
              git {
                remote { url('${INVENTARIO_REPO:-https://github.com/mljuansmoreno/inventario-ci.git}') }
                branch('*/main')
              }
            }
            scriptPath('app/Jenkinsfile')
          }
        }
      }
