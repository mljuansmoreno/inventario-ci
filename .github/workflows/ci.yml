name: Inventario CI
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Pruebas unitarias
        run: sh app/ci/pruebas.sh
      - name: Guardar JUnit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reporte-pruebas
          path: app/reportes/junit.xml
          if-no-files-found: error
  imagen:
    needs: pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IMAGEN: inventario:${{ github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Construir imagen
        run: docker build -t "$IMAGEN" app
      - name: Prueba de humo
        run: sh app/ci/humo.sh "$IMAGEN"
