name: Inventario CI
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Pruebas unitarias
        run: sh app/ci/pruebas.sh
      - name: Guardar JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-pruebas
          path: app/reportes/junit.xml
          if-no-files-found: error
  imagen:
    needs: pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IMAGEN: inventario:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen
        run: docker build -t "$IMAGEN" app
